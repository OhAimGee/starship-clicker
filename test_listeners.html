<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Event Listeners - Starship Clicker</title>
    <style>
      body {
        background: #0a0a1a;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #333;
        border-radius: 8px;
      }
      .mothership-test {
        width: 100px;
        height: 100px;
        background: #444;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2em;
        cursor: pointer;
        margin: 10px 0;
      }
      .log {
        background: #1a1a1a;
        padding: 10px;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
      }
      .success {
        color: #00ff88;
      }
      .error {
        color: #ff4444;
      }
      .info {
        color: #00d4ff;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Test des Event Listeners</h1>

    <div class="test-section">
      <h2>Test du clic sur le vaisseau mère</h2>
      <div class="mothership-test" id="mothership">🛸</div>
      <p>Cliquez sur le vaisseau pour tester</p>
      <div class="log" id="click-log"></div>
    </div>

    <div class="test-section">
      <h2>Test des elements existants</h2>
      <div class="log" id="elements-log"></div>
    </div>

    <div class="test-section">
      <h2>Log des événements</h2>
      <div class="log" id="main-log"></div>
    </div>

    <script>
      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const logElement = document.getElementById("main-log");
        const entry = document.createElement("div");
        entry.className = type;
        entry.textContent = `[${timestamp}] ${message}`;
        logElement.appendChild(entry);
        logElement.scrollTop = logElement.scrollHeight;
        console.log(`[${type.toUpperCase()}] ${message}`);
      }

      function logClick(message) {
        const timestamp = new Date().toLocaleTimeString();
        const logElement = document.getElementById("click-log");
        const entry = document.createElement("div");
        entry.className = "success";
        entry.textContent = `[${timestamp}] ${message}`;
        logElement.appendChild(entry);
        logElement.scrollTop = logElement.scrollHeight;
      }

      function logElements(message, type = "info") {
        const logElement = document.getElementById("elements-log");
        const entry = document.createElement("div");
        entry.className = type;
        entry.textContent = message;
        logElement.appendChild(entry);
      }

      // Test de base
      document.addEventListener("DOMContentLoaded", () => {
        log("DOM Content Loaded", "success");

        // Vérifier les éléments de base
        const mothership = document.getElementById("mothership");
        if (mothership) {
          logElements("✅ Element #mothership trouvé", "success");

          // Ajouter event listener de test
          mothership.addEventListener("click", (e) => {
            logClick("Clic détecté sur le vaisseau mère");
            e.target.style.background = "#00ff88";
            setTimeout(() => {
              e.target.style.background = "#444";
            }, 200);
          });

          log("Event listener ajouté au vaisseau mère", "success");
        } else {
          logElements("❌ Element #mothership NON trouvé", "error");
        }

        // Simuler le chargement du jeu principal
        setTimeout(() => {
          log("Simulation du chargement du jeu...", "info");

          // Tester si on peut créer une instance similaire
          try {
            log("Test de création d'objet jeu...", "info");

            const testGame = {
              clickMothership: function (e) {
                logClick("clickMothership() appelé avec succès");
                return true;
              },
              init: function () {
                log("init() appelé avec succès", "success");
                return true;
              },
            };

            // Test des méthodes
            testGame.init();
            testGame.clickMothership({});

            log("Tests de base réussis ✅", "success");
          } catch (error) {
            log(`Erreur lors des tests: ${error.message}`, "error");
          }
        }, 1000);
      });

      // Test manuel du clic
      window.testClick = () => {
        const mothership = document.getElementById("mothership");
        if (mothership) {
          const event = new MouseEvent("click", {
            bubbles: true,
            cancelable: true,
            view: window,
          });
          mothership.dispatchEvent(event);
          log("Clic manuel déclenché", "info");
        }
      };

      log("Script de test chargé", "success");
    </script>
  </body>
</html>
