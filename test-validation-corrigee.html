<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test de Validation Rapide</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        background: #1a1a2e;
        color: #eee;
        padding: 20px;
        margin: 0;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #16213e;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #00ff88;
        border-radius: 5px;
        background: rgba(0, 255, 136, 0.1);
      }
      .test-button {
        background: #00ff88;
        color: #1a1a2e;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin: 5px;
      }
      .test-button:hover {
        background: #00cc6a;
      }
      #console-output {
        background: #0f1419;
        padding: 15px;
        border-radius: 5px;
        margin-top: 20px;
        min-height: 400px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
      .success {
        color: #00ff88;
      }
      .error {
        color: #ff4444;
      }
      .warning {
        color: #ffaa00;
      }
      .info {
        color: #66ccff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🧪 Test de Validation Corrigée</h1>

      <div class="test-section">
        <h2>🎯 Tests Disponibles</h2>
        <button class="test-button" onclick="testValidationInIframe()">
          Test Validation dans iFrame
        </button>
        <button class="test-button" onclick="testElementsManually()">
          Test Manuel des Éléments
        </button>
        <button class="test-button" onclick="openMainGame()">
          🎮 Ouvrir le Jeu Principal
        </button>
        <button class="test-button" onclick="clearConsole()">
          🧹 Nettoyer
        </button>
      </div>

      <div class="test-section">
        <h2>📋 Console de Test</h2>
        <div id="console-output">
          ⏳ Prêt pour les tests. Cliquez sur un bouton ci-dessus.
        </div>
      </div>
    </div>

    <script>
      const consoleOutput = document.getElementById("console-output");

      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const colors = {
          success: "#00ff88",
          error: "#ff4444",
          warning: "#ffaa00",
          info: "#ffffff",
        };

        const line = document.createElement("div");
        line.style.color = colors[type];
        line.textContent = `[${timestamp}] ${message}`;
        consoleOutput.appendChild(line);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }

      function clearConsole() {
        consoleOutput.innerHTML =
          "⏳ Console nettoyée. Prêt pour de nouveaux tests.";
      }

      function openMainGame() {
        log("🎮 Ouverture du jeu principal...", "info");
        window.open("index.html", "_blank");
      }

      function testElementsManually() {
        log("🔍 Test manuel des éléments critiques...", "info");

        // Créer une iframe cachée pour tester
        const iframe = document.createElement("iframe");
        iframe.src = "index.html";
        iframe.style.display = "none";
        document.body.appendChild(iframe);

        iframe.onload = () => {
          setTimeout(() => {
            try {
              const doc = iframe.contentDocument;

              // Test des éléments corrigés
              const elementsToTest = [
                "mothership",
                "energy-count",
                "shop-panel",
                "fleet-panel",
                "exploration-panel",
                "technology-panel",
                "ascension-panel",
              ];

              let found = 0;

              elementsToTest.forEach((id) => {
                const element = doc.getElementById(id);
                if (element) {
                  log(`✅ ${id} trouvé`, "success");
                  found++;
                } else {
                  log(`❌ ${id} manquant`, "error");
                }
              });

              // Test des boutons avec data-tab
              const tabButtons = [
                "shop",
                "fleet",
                "exploration",
                "technology",
                "ascension",
              ];
              let tabsFound = 0;

              tabButtons.forEach((tab) => {
                const button = doc.querySelector(`[data-tab="${tab}"]`);
                if (button) {
                  log(`✅ Bouton ${tab} (data-tab) trouvé`, "success");
                  tabsFound++;
                } else {
                  log(`❌ Bouton ${tab} (data-tab) manquant`, "error");
                }
              });

              log(`📊 Résultat final:`, "info");
              log(
                `   Éléments: ${found}/${elementsToTest.length}`,
                found === elementsToTest.length ? "success" : "warning"
              );
              log(
                `   Onglets: ${tabsFound}/${tabButtons.length}`,
                tabsFound === tabButtons.length ? "success" : "warning"
              );

              if (
                found === elementsToTest.length &&
                tabsFound === tabButtons.length
              ) {
                log("🎉 TOUS LES TESTS RÉUSSIS !", "success");
              } else {
                log("⚠️ Certains éléments sont manquants", "warning");
              }
            } catch (error) {
              log(`❌ Erreur lors du test: ${error.message}`, "error");
            } finally {
              document.body.removeChild(iframe);
            }
          }, 2000);
        };
      }

      function testValidationInIframe() {
        log("🧪 Test de la validation automatique...", "info");

        const iframe = document.createElement("iframe");
        iframe.src = "index.html";
        iframe.style.display = "none";
        document.body.appendChild(iframe);

        iframe.onload = () => {
          setTimeout(() => {
            try {
              // Écouter les messages de la console de l'iframe
              const originalLog = iframe.contentWindow.console.log;
              iframe.contentWindow.console.log = function (...args) {
                log(`[IFRAME] ${args.join(" ")}`, "info");
                originalLog.apply(console, args);
              };

              // Vérifier si la fonction runValidation existe
              if (typeof iframe.contentWindow.runValidation === "function") {
                log("✅ Fonction runValidation trouvée", "success");
                iframe.contentWindow.runValidation();
              } else {
                log("❌ Fonction runValidation non trouvée", "error");
              }

              setTimeout(() => {
                document.body.removeChild(iframe);
              }, 5000);
            } catch (error) {
              log(`❌ Erreur test iframe: ${error.message}`, "error");
              document.body.removeChild(iframe);
            }
          }, 3000);
        };
      }

      // Log initial
      log("🧪 Interface de test chargée", "success");
      log("💡 Validation corrigée pour chercher les bons éléments", "info");
    </script>
  </body>
</html>
