<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test - Starship Clicker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f0f0f0;
      }
      .test-result {
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <h1>🚀 Test Starship Clicker</h1>
    <div id="test-results"></div>

    <script src="script.js"></script>
    <script>
      // Test simple du jeu
      function runTests() {
        const resultsDiv = document.getElementById("test-results");
        const tests = [];

        try {
          // Test 1: Initialisation du jeu
          console.log("Test 1: Initialisation du jeu");
          const game = new StarshipClicker();
          tests.push({
            name: "Initialisation du jeu",
            success: true,
            message: "Le jeu s'initialise correctement",
          });

          // Test 2: État initial des ressources
          console.log("Test 2: État initial des ressources");
          const hasAllResources =
            game.gameState.resources.energy !== undefined &&
            game.gameState.resources.metal !== undefined &&
            game.gameState.resources.crystals !== undefined &&
            game.gameState.resources.antimatter !== undefined &&
            game.gameState.resources.influence !== undefined;
          tests.push({
            name: "État initial des ressources",
            success: hasAllResources,
            message: hasAllResources
              ? "Toutes les ressources sont définies"
              : "Ressources manquantes",
          });

          // Test 3: Génération de systèmes
          console.log("Test 3: Génération de systèmes");
          const hasGeneratedSystems =
            game.gameState.availableSystems.length > 0;
          tests.push({
            name: "Génération de systèmes",
            success: hasGeneratedSystems,
            message: hasGeneratedSystems
              ? `${game.gameState.availableSystems.length} systèmes générés`
              : "Aucun système généré",
          });

          // Test 4: Méthodes principales
          console.log("Test 4: Méthodes principales");
          const hasMethods =
            typeof game.buyGenerator === "function" &&
            typeof game.buyShip === "function" &&
            typeof game.researchTechnology === "function" &&
            typeof game.updateDisplay === "function";
          tests.push({
            name: "Méthodes principales",
            success: hasMethods,
            message: hasMethods
              ? "Toutes les méthodes principales sont définies"
              : "Méthodes manquantes",
          });

          // Test 5: Format des nombres
          console.log("Test 5: Format des nombres");
          const formattedNumber = game.formatNumber(1500);
          const formatWorking = formattedNumber === "1.5K";
          tests.push({
            name: "Format des nombres",
            success: formatWorking,
            message: formatWorking
              ? "Formatage correct (1500 → 1.5K)"
              : `Formatage incorrect: ${formattedNumber}`,
          });
        } catch (error) {
          tests.push({
            name: "Erreur critique",
            success: false,
            message: error.message,
          });
        }

        // Afficher les résultats
        resultsDiv.innerHTML = tests
          .map(
            (test) => `
                <div class="test-result ${test.success ? "success" : "error"}">
                    <strong>${test.name}:</strong> ${test.message}
                </div>
            `
          )
          .join("");

        const successCount = tests.filter((t) => t.success).length;
        console.log(`Tests terminés: ${successCount}/${tests.length} réussis`);
      }

      // Lancer les tests après chargement
      document.addEventListener("DOMContentLoaded", () => {
        setTimeout(runTests, 100);
      });
    </script>
  </body>
</html>
