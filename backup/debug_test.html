<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Test - Starship Clicker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        padding: 20px;
        text-align: center;
      }
      #mothership {
        font-size: 4rem;
        cursor: pointer;
        margin: 20px;
        padding: 40px;
        border: 3px solid #00f5ff;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 245, 255, 0.2) 0%,
          rgba(0, 100, 255, 0.1) 70%
        );
        display: inline-block;
        transition: all 0.3s ease;
      }
      #mothership:hover {
        transform: scale(1.05);
      }
      .debug-info {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        margin: 20px auto;
        border-radius: 10px;
        max-width: 600px;
      }
      .test-btn {
        background: #00f5ff;
        color: #000;
        border: none;
        padding: 10px 20px;
        margin: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }
      .test-btn:hover {
        background: #00ccdd;
      }
      .error {
        color: #ff4444;
      }
      .success {
        color: #44ff44;
      }
    </style>
  </head>
  <body>
    <h1>🚀 DEBUG TEST - Starship Clicker 🚀</h1>

    <div class="debug-info">
      <h2>État de Debug</h2>
      <p>Énergie: <span id="energy-count">0</span></p>
      <p>Statut: <span id="status">Initialisation...</span></p>
      <p>Erreurs: <span id="errors">Aucune</span></p>
    </div>

    <div id="mothership">🛸</div>

    <div>
      <button class="test-btn" onclick="testDirectClick()">
        Test Clic Direct
      </button>
      <button class="test-btn" onclick="testGameState()">
        Test État du Jeu
      </button>
      <button class="test-btn" onclick="testEventListener()">
        Test Event Listener
      </button>
      <button class="test-btn" onclick="clearErrors()">Effacer Erreurs</button>
    </div>

    <div class="debug-info">
      <h3>Log de Debug</h3>
      <div id="debug-log"></div>
    </div>

    <script>
      let debugGame = null;

      function log(message, type = "info") {
        const debugLog = document.getElementById("debug-log");
        const time = new Date().toLocaleTimeString();
        const className =
          type === "error" ? "error" : type === "success" ? "success" : "";
        debugLog.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
        debugLog.scrollTop = debugLog.scrollHeight;
      }

      function updateStatus(status) {
        document.getElementById("status").textContent = status;
      }

      function updateEnergy(energy) {
        document.getElementById("energy-count").textContent = energy;
      }

      function clearErrors() {
        document.getElementById("debug-log").innerHTML = "";
        document.getElementById("errors").textContent = "Aucune";
      }

      // Test de clic direct sur l'élément
      function testDirectClick() {
        log("Test de clic direct sur le vaisseau...", "info");
        const mothership = document.getElementById("mothership");
        if (mothership) {
          mothership.click();
          log("Clic simulé envoyé", "success");
        } else {
          log("Élément mothership non trouvé!", "error");
        }
      }

      // Test de l'état du jeu
      function testGameState() {
        log("Test de l'état du jeu...", "info");
        if (window.game) {
          log("Objet game trouvé: " + typeof window.game, "success");
          log(
            "Énergie actuelle: " + window.game.gameState.resources.energy,
            "info"
          );
          log("Puissance de clic: " + window.game.gameState.clickPower, "info");
        } else {
          log("Objet window.game non trouvé!", "error");
        }
      }

      // Test des event listeners
      function testEventListener() {
        log("Test des event listeners...", "info");
        const mothership = document.getElementById("mothership");
        if (mothership) {
          const hasClickListener = mothership.onclick !== null;
          log(
            "onclick handler: " + hasClickListener,
            hasClickListener ? "success" : "error"
          );

          // Ajouter un listener de test
          mothership.addEventListener("click", function () {
            log("Event listener de test déclenché!", "success");
          });
          log("Event listener de test ajouté", "success");
        }
      }

      // Initialisation du debug
      window.addEventListener("DOMContentLoaded", function () {
        log("DOM chargé", "success");
        updateStatus("DOM chargé, attente du jeu...");

        // Vérifier si le jeu est chargé toutes les 500ms
        const checkGame = setInterval(function () {
          if (window.game) {
            clearInterval(checkGame);
            debugGame = window.game;
            log("Jeu trouvé et connecté!", "success");
            updateStatus("Jeu connecté");
            updateEnergy(debugGame.gameState.resources.energy);
          }
        }, 500);

        // Timeout après 10 secondes
        setTimeout(function () {
          if (!debugGame) {
            log("Timeout: Jeu non trouvé après 10 secondes", "error");
            updateStatus("Erreur: Jeu non trouvé");
            document.getElementById("errors").textContent =
              "Jeu non initialisé";
          }
        }, 10000);
      });

      // Capture des erreurs JavaScript
      window.addEventListener("error", function (e) {
        log(
          "Erreur JavaScript: " + e.message + " (ligne " + e.lineno + ")",
          "error"
        );
        document.getElementById("errors").textContent = e.message;
      });

      // Observer les changements d'énergie
      const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (mutation.target.id === "energy-count") {
            log(
              "Changement d'énergie détecté: " + mutation.target.textContent,
              "success"
            );
          }
        });
      });

      setTimeout(function () {
        const energyElement = document.getElementById("energy-count");
        if (energyElement) {
          observer.observe(energyElement, {
            childList: true,
            characterData: true,
            subtree: true,
          });
          log("Observer d'énergie configuré", "success");
        }
      }, 1000);
    </script>

    <!-- Charger le script principal -->
    <script src="script.js" defer></script>
  </body>
</html>
